name: Refresh data

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # TODO: replace with the real console API URL and auth shape once we've
      # checked its docs together (header vs query param, response shape).
      - name: Fetch console data
        env:
          CONSOLE_API_KEY: ${{ secrets.CONSOLE_API_KEY }}
        run: |
          curl -sf \
            -H "Authorization: Bearer $CONSOLE_API_KEY" \
            "https://REPLACE_ME.example.com/api/items" \
            -o raw.json

          node -e '
            const raw = require("./raw.json");
            const items = raw.items ?? raw;
            const out = {
              updatedAt: new Date().toISOString(),
              items: items.map(i => ({
                id: String(i.id),
                title: i.title ?? i.name ?? "Untitled",
                subtitle: i.subtitle ?? i.status ?? "",
                description: i.description ?? "",
                timestamp: i.timestamp ?? new Date().toISOString(),
              })),
            };
            require("fs").writeFileSync("data.json", JSON.stringify(out, null, 2));
          '
          rm raw.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet --cached || git commit -m "Refresh data"
          git push
