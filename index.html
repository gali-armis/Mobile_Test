<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Armis Mobile Prototype</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0052cc" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="gate" class="gate">
    <div class="gate-box">
      <h2>Enter passcode</h2>
      <input id="gate-input" type="password" inputmode="text" autocomplete="off" />
      <button id="gate-submit">Continue</button>
      <div id="gate-error" class="gate-error hidden">Incorrect passcode</div>
    </div>
  </div>

  <div id="app" class="phone hidden">
    <div class="topbar">
      <button id="back-button" class="back-button hidden">&larr; Back</button>
      <h1 id="title">Home</h1>
    </div>

    <div class="content">
      <div id="screen-home" class="screen">
        <div class="placeholder">Welcome. Use the tabs below to browse alerts, activities, and notifications.</div>
      </div>

      <div id="screen-alerts" class="screen hidden">
        <ul id="alerts-list" class="list"></ul>
      </div>

      <div id="screen-alert-detail" class="screen hidden detail">
        <div id="alert-detail"></div>
      </div>

      <div id="screen-activities" class="screen hidden">
        <ul id="activities-list" class="list"></ul>
      </div>

      <div id="screen-activity-detail" class="screen hidden detail">
        <div id="activity-detail"></div>
      </div>

      <div id="screen-notifications" class="screen hidden">
        <div id="notifications-empty" class="placeholder hidden">
          <p>You haven't followed any policies yet.</p>
          <button id="browse-policies-button">Browse policies</button>
        </div>
        <ul id="notifications-list" class="list hidden"></ul>
      </div>

      <div id="screen-policies" class="screen hidden">
        <ul id="policies-list" class="list"></ul>
      </div>
    </div>

    <div class="footer-nav">
      <button class="nav-button" data-route="#/home">Home</button>
      <button class="nav-button" data-route="#/alerts">Alerts</button>
      <button class="nav-button" data-route="#/activities">Activities</button>
      <button class="nav-button" data-route="#/notifications">Notifications</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
