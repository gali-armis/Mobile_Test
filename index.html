<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Armis Mobile Prototype</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0052cc" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="gate" class="gate">
    <div class="gate-box">
      <h2>Enter passcode</h2>
      <input id="gate-input" type="password" inputmode="text" autocomplete="off" />
      <button id="gate-submit">Continue</button>
      <div id="gate-error" class="gate-error hidden">Incorrect passcode</div>
    </div>
  </div>

  <div id="app" class="phone hidden">
    <div class="topbar">
      <button id="back-button" class="back-button hidden">&larr; Back</button>
      <h1 id="title">Alerts</h1>
    </div>

    <div class="demo-controls">
      <button id="simulate-button">Simulate new alert (demo)</button>
    </div>

    <div id="list-screen">
      <ul id="list" class="list"></ul>
    </div>

    <div id="detail-screen" class="detail hidden">
      <div id="detail"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
